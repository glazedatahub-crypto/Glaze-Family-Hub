name: Update Family Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Glaze calendar
        run: |
          curl -L --fail \
          "https://calendar.google.com/calendar/ical/glazedatahub%40gmail.com/public/basic.ics" \
          -o glaze-calendar.ics

      - name: Download BASH calendar
        run: |
          curl -L --fail \
          "https://calendar.google.com/calendar/ical/bashhomeschoolers%40gmail.com/public/basic.ics" \
          -o bash-calendar.ics

      - name: Download Savanna calendar
        run: |
          curl -L --fail \
          "https://calendar.google.com/calendar/ical/savannaglaze%40gmail.com/public/basic.ics" \
          -o savanna-calendar.ics

      - name: Commit updated calendars
        run: |
          git config user.name "Glaze Family Hub"
          git config user.email "actions@github.com"

          git add glaze-calendar.ics bash-calendar.ics savanna-calendar.ics

          if git diff --cached --quiet; then
            echo "No calendar changes"
          else
            git commit -m "Update family calendars"
            git push
          fi
