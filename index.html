<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Glaze Family Hub</title>

<script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.21/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/icalendar@6.1.21/index.global.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  color: #202124;
}

body {
  min-height: 100vh;

  background-image:
    linear-gradient(
      rgba(10,18,28,0.10),
      rgba(10,18,28,0.10)
    ),
    url("IMG_2348.png");

  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  background-attachment: fixed;

  padding: 10px 18px;
}

.hub {
  width: 100%;
  max-width: 1750px;
  margin: 0 auto;
}


/* GLASS */

.glass {
  background: rgba(255,255,255,0.70);
  border: 1px solid rgba(255,255,255,0.76);
  box-shadow: 0 6px 22px rgba(0,0,0,0.12);

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}


/* TOP BAR */

.topbar {
  display: grid;

  grid-template-columns:
    260px minmax(350px,1fr) 125px 150px;

  gap: 10px;
  align-items: stretch;
  margin-bottom: 8px;
}

.date-box,
.next-box,
.weather-box,
.clock-box {
  border-radius: 17px;
  overflow: hidden;
}


/* DATE */

.date-box {
  padding: 10px 18px;
}

.hub-name {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 1.5px;
  color: #4f4f4f;
  margin-bottom: 2px;
}

.day {
  font-size: 29px;
  font-weight: 800;
  line-height: 1;
}

.date {
  font-size: 14px;
  color: #555;
  margin-top: 5px;
}


/* UP NEXT */

.next-box {
  padding: 7px 9px 6px;
}

.next-title {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1px;
  color: #555;
  margin: 0 0 3px 4px;
}

.next-calendar {
  width: 100%;
  height: 68px;
  overflow: hidden;
  border-radius: 10px;
}

.next-calendar iframe {
  display: block;
  width: 100%;
  height: 125px;
  border: 0;
  margin-top: -2px;
}


/* WEATHER */

.weather-box {
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
  padding: 8px;
}

.weather-main {
  font-size: 24px;
  font-weight: 800;
}

.weather-label {
  font-size: 10px;
  color: #666;
  margin-top: 2px;
}


/* CLOCK */

.clock-box {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 8px;
}

.clock {
  font-size: 30px;
  font-weight: 800;
}


/* COUNTDOWN CARDS */

.cards {
  display: grid;
  grid-template-columns: repeat(5,minmax(0,1fr));
  gap: 8px;
  margin-bottom: 8px;
}

.card {
  min-height: 108px;
  border: 2px solid;
  border-radius: 17px;
  text-align: center;
  padding: 8px 6px;

  display: flex;
  flex-direction: column;
  justify-content: center;

  box-shadow: 0 5px 14px rgba(0,0,0,0.10);

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.event-name {
  font-size: 17px;
  font-weight: 900;
  line-height: 1.1;
  min-height: 38px;

  display: flex;
  align-items: center;
  justify-content: center;
}

.days {
  font-size: 36px;
  font-weight: 900;
  line-height: 1;
  margin-top: 3px;
}

.days-label {
  font-size: 11px;
  font-weight: 700;
  margin-top: 2px;
  letter-spacing: .6px;
}

.event-date {
  font-size: 12px;
  font-weight: 700;
  margin-top: 3px;
  opacity: .85;
}


/* FAMILY COLORS */

.mom {
  background: rgba(255,227,240,.78);
  border-color: #ff78b5;
  color: #a21858;
}

.daddy {
  background: rgba(239,255,214,.78);
  border-color: #9be000;
  color: #4d7300;
}

.ryder {
  background: rgba(229,235,255,.78);
  border-color: #4169e1;
  color: #183a9b;
}

.clyde {
  background: rgba(227,248,233,.78);
  border-color: #2e9d50;
  color: #186634;
}

.wyatt {
  background: rgba(255,228,228,.78);
  border-color: #e53935;
  color: #9e211f;
}

.charlotte {
  background: rgba(241,228,255,.78);
  border-color: #9b59d0;
  color: #63328b;
}


/* HOLIDAYS */

.halloween {
  background: rgba(255,240,223,.80);
  border-color: #ff8c00;
  color: #a35200;
}

.thanksgiving {
  background: rgba(255,241,227,.80);
  border-color: #c76b2b;
  color: #864011;
}

.christmas {
  background: rgba(232,246,236,.80);
  border-color: #2d8b57;
  color: #195638;
}

.newyear {
  background: rgba(230,239,255,.80);
  border-color: #4c7de8;
  color: #264b9b;
}


/* CUSTOM CALENDAR PANEL */

.calendar-panel {
  padding: 10px;
  border-radius: 18px;
  overflow: hidden;
}

#calendar {
  background: rgba(255,255,255,.92);
  border-radius: 13px;
  overflow: hidden;
  padding: 6px;
}


/* CALENDAR HEADER */

.fc .fc-toolbar {
  margin: 2px 4px 8px 4px !important;
}

.fc .fc-toolbar-title {
  font-size: 27px !important;
  font-weight: 900 !important;
  color: #222 !important;
}

.fc .fc-button {
  background: rgba(255,255,255,.88) !important;
  color: #333 !important;

  border: 1px solid #bbb !important;

  font-weight: 800 !important;

  box-shadow: none !important;
}

.fc .fc-button:hover {
  background: #f2f2f2 !important;
}

.fc .fc-button-primary:not(:disabled).fc-button-active {
  background: #e6efff !important;
  color: #244f9d !important;
}


/* WEEKDAY HEADERS */

.fc .fc-col-header-cell {
  background: rgba(242,245,249,.96);
}

.fc .fc-col-header-cell-cushion {
  color: #333 !important;
  text-decoration: none !important;
  font-size: 15px !important;
  font-weight: 900 !important;
  padding: 6px 2px !important;
}


/* DAY BOXES */

.fc .fc-daygrid-day {
  background: rgba(255,255,255,.80);
}

.fc .fc-daygrid-day-frame {
  min-height: 86px;
}

.fc .fc-daygrid-day-number {
  color: #333 !important;
  text-decoration: none !important;

  font-size: 16px !important;
  font-weight: 900 !important;

  padding: 6px 7px 3px !important;
}


/* DAYS OUTSIDE CURRENT MONTH */

.fc .fc-day-other {
  background: rgba(238,238,238,.60);
}

.fc .fc-day-other .fc-daygrid-day-number {
  opacity: .35;
}


/* =====================================
   TODAY - HIGHLIGHT THE WHOLE BOX
===================================== */

.fc .fc-day-today {
  background: rgba(203,225,255,.92) !important;

  box-shadow:
    inset 0 0 0 3px #4385e8 !important;
}

.fc .fc-day-today .fc-daygrid-day-number {
  color: #174f9f !important;
  font-size: 18px !important;
}


/* EVENTS */

.fc .fc-daygrid-event {
  border: 0 !important;
  border-radius: 5px !important;

  padding: 3px 5px !important;

  margin: 2px 3px !important;

  font-size: 12px !important;
  font-weight: 800 !important;

  line-height: 1.18 !important;

  white-space: normal !important;
}

.fc .fc-event-title {
  white-space: normal !important;
  overflow: visible !important;
  font-weight: 800 !important;
}


/* GLAZE CALENDAR EVENTS */

.glaze-event {
  background: #dceaff !important;
  color: #1f4d8f !important;
  border-left: 4px solid #4f8fe8 !important;
}


/* BASH EVENTS */

.bash-event {
  background: #e7f6e8 !important;
  color: #245d2b !important;
  border-left: 4px solid #55a95c !important;
}


/* MORE EVENTS LINK */

.fc .fc-daygrid-more-link {
  font-size: 11px !important;
  font-weight: 900 !important;
  color: #315fa7 !important;
}


/* GRID LINES */

.fc-theme-standard td,
.fc-theme-standard th {
  border-color: rgba(90,100,110,.25) !important;
}


/* TV */

@media (min-width:1200px) {

  body {
    padding: 10px 18px;
  }

  .hub {
    max-width: 1750px;
  }

  .fc .fc-daygrid-day-frame {
    min-height: 92px;
  }

}


/* SMALLER SCREENS */

@media (max-width:900px) {

  body {
    padding: 8px;
  }

  .topbar {
    grid-template-columns:
      210px 1fr 100px 125px;

    gap: 6px;
  }

  .date-box {
    padding: 8px 10px;
  }

  .hub-name {
    font-size: 10px;
  }

  .day {
    font-size: 23px;
  }

  .date {
    font-size: 11px;
  }

  .next-title {
    font-size: 9px;
  }

  .weather-main {
    font-size: 21px;
  }

  .clock {
    font-size: 25px;
  }

  .cards {
    gap: 5px;
  }

  .card {
    min-height: 100px;
    border-radius: 13px;
  }

  .event-name {
    font-size: 14px;
  }

  .days {
    font-size: 30px;
  }

  .days-label {
    font-size: 10px;
  }

  .event-date {
    font-size: 10px;
  }

  .fc .fc-toolbar-title {
    font-size: 20px !important;
  }

  .fc .fc-daygrid-event {
    font-size: 10px !important;
  }

  .fc .fc-daygrid-day-frame {
    min-height: 76px;
  }

}

</style>
</head>


<body>

<div class="hub">


<!-- TOP BAR -->

<div class="topbar">


  <div class="date-box glass">

    <div class="hub-name">
      GLAZE FAMILY HUB
    </div>

    <div class="day" id="day"></div>

    <div class="date" id="date"></div>

  </div>


  <!-- UP NEXT -->

  <div class="next-box glass">

    <div class="next-title">
      UP NEXT
    </div>

    <div class="next-calendar">

      <iframe
        src="https://calendar.google.com/calendar/embed?height=125&wkst=1&ctz=America%2FChicago&showTitle=0&showNav=0&showDate=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0&mode=AGENDA&src=glazedatahub%40gmail.com&src=bashhomeschoolers%40gmail.com"
        frameborder="0"
        scrolling="no">
      </iframe>

    </div>

  </div>


  <!-- WEATHER -->

  <div class="weather-box glass">

    <div class="weather-main" id="weatherMain">
      --°
    </div>

    <div class="weather-label">
      Manvel
    </div>

  </div>


  <!-- CLOCK -->

  <div class="clock-box glass">

    <div class="clock" id="clock"></div>

  </div>

</div>



<!-- COUNTDOWNS -->

<div class="cards" id="cards"></div>



<!-- CUSTOM MONTH CALENDAR -->

<div class="calendar-panel glass">

  <div id="calendar"></div>

</div>


</div>



<script>


/* DATE + CLOCK */

function updateClock() {

  const now = new Date();

  document.getElementById("day").textContent =
    now.toLocaleDateString(
      "en-US",
      {
        weekday: "long"
      }
    );

  document.getElementById("date").textContent =
    now.toLocaleDateString(
      "en-US",
      {
        month: "long",
        day: "numeric",
        year: "numeric"
      }
    );

  document.getElementById("clock").textContent =
    now.toLocaleTimeString(
      "en-US",
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );

}

updateClock();

setInterval(updateClock,30000);



/* WEATHER */

function weatherIcon(code) {

  if (code === 0)
    return "☀️";

  if (
    code === 1 ||
    code === 2
  )
    return "🌤️";

  if (code === 3)
    return "☁️";

  if (
    code === 45 ||
    code === 48
  )
    return "🌫️";

  if (
    (code >= 51 && code <= 67) ||
    (code >= 80 && code <= 82)
  )
    return "🌧️";

  if (
    code >= 71 &&
    code <= 77
  )
    return "❄️";

  if (code >= 95)
    return "⛈️";

  return "🌤️";

}


async function updateWeather() {

  try {

    const response =
      await fetch(
        "https://api.open-meteo.com/v1/forecast?latitude=29.46&longitude=-95.36&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=America%2FChicago"
      );

    const data =
      await response.json();

    const temp =
      Math.round(
        data.current.temperature_2m
      );

    const icon =
      weatherIcon(
        data.current.weather_code
      );

    document.getElementById("weatherMain").textContent =
      icon + " " + temp + "°";

  }

  catch(error) {

    document.getElementById("weatherMain").textContent =
      "--°";

  }

}

updateWeather();

setInterval(updateWeather,900000);



/* BIRTHDAYS */

const birthdays = [

  {
    name: "Mom",
    month: 10,
    day: 9,
    year: 1996,
    className: "mom"
  },

  {
    name: "Daddy",
    month: 11,
    day: 11,
    year: 1995,
    className: "daddy"
  },

  {
    name: "Ryder",
    month: 10,
    day: 18,
    year: 2016,
    className: "ryder"
  },

  {
    name: "Clyde",
    month: 4,
    day: 21,
    year: 2018,
    className: "clyde"
  },

  {
    name: "Wyatt",
    month: 12,
    day: 8,
    year: 2019,
    className: "wyatt"
  },

  {
    name: "Charlotte",
    month: 11,
    day: 9,
    year: 2021,
    className: "charlotte"
  }

];


function thanksgiving(year) {

  let d =
    new Date(
      year,
      10,
      1
    );

  while(
    d.getDay() !== 4
  ) {

    d.setDate(
      d.getDate() + 1
    );

  }

  d.setDate(
    d.getDate() + 21
  );

  return d;

}


function ordinal(number) {

  const lastTwo =
    number % 100;

  if(
    lastTwo >= 11 &&
    lastTwo <= 13
  ) {

    return number + "th";

  }

  switch(number % 10) {

    case 1:
      return number + "st";

    case 2:
      return number + "nd";

    case 3:
      return number + "rd";

    default:
      return number + "th";

  }

}



/* UPCOMING COUNTDOWNS */

function upcomingEvents() {

  const now = new Date();

  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

  const events = [];


  birthdays.forEach(
    person => {

      let year =
        today.getFullYear();

      let eventDate =
        new Date(
          year,
          person.month - 1,
          person.day
        );

      if(eventDate < today) {

        year++;

        eventDate =
          new Date(
            year,
            person.month - 1,
            person.day
          );

      }

      const age =
        year -
        person.year;

      events.push({

        name:
          person.name +
          "'s " +
          ordinal(age) +
          " Birthday",

        date:
          eventDate,

        className:
          person.className

      });

    }
  );


  const holidays = [

    {
      name: "Halloween",
      month: 10,
      day: 31,
      className: "halloween"
    },

    {
      name: "Christmas",
      month: 12,
      day: 25,
      className: "christmas"
    }

  ];


  holidays.forEach(
    holiday => {

      let year =
        today.getFullYear();

      let eventDate =
        new Date(
          year,
          holiday.month - 1,
          holiday.day
        );

      if(eventDate < today) {

        eventDate =
          new Date(
            year + 1,
            holiday.month - 1,
            holiday.day
          );

      }

      events.push({

        name:
          holiday.name,

        date:
          eventDate,

        className:
          holiday.className

      });

    }
  );


  let thanksgivingDate =
    thanksgiving(
      today.getFullYear()
    );

  if(
    thanksgivingDate <
    today
  ) {

    thanksgivingDate =
      thanksgiving(
        today.getFullYear() + 1
      );

  }

  events.push({

    name:
      "Thanksgiving",

    date:
      thanksgivingDate,

    className:
      "thanksgiving"

  });


  const newYear =
    new Date(
      today.getFullYear() + 1,
      0,
      1
    );

  events.push({

    name:
      "New Year's",

    date:
      newYear,

    className:
      "newyear"

  });


  events.sort(
    (a,b) =>
      a.date -
      b.date
  );


  return events.slice(
    0,
    5
  );

}



/* RENDER COUNTDOWNS */

function renderCountdowns() {

  const now = new Date();

  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

  const cards =
    document.getElementById(
      "cards"
    );

  cards.innerHTML = "";


  upcomingEvents().forEach(
    event => {

      const days =
        Math.round(
          (
            event.date -
            today
          )
          /
          86400000
        );

      const dateText =
        event.date.toLocaleDateString(
          "en-US",
          {
            month: "long",
            day: "numeric"
          }
        );

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "card " +
        event.className;

      card.innerHTML = `

        <div class="event-name">
          ${event.name}
        </div>

        <div class="days">
          ${days}
        </div>

        <div class="days-label">
          DAYS
        </div>

        <div class="event-date">
          ${dateText}
        </div>

      `;

      cards.appendChild(card);

    }
  );

}

renderCountdowns();



/* CUSTOM CALENDAR */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    const calendarEl =
      document.getElementById(
        "calendar"
      );


    const calendar =
      new FullCalendar.Calendar(
        calendarEl,
        {

          plugins: [
            FullCalendar.iCalendarPlugin
          ],

          initialView:
            "dayGridMonth",

          timeZone:
            "America/Chicago",

          firstDay:
            1,

          fixedWeekCount:
            false,

          showNonCurrentDates:
            true,

          height:
            "auto",

          dayMaxEvents:
            4,

          displayEventTime:
            true,

          eventTimeFormat: {
            hour:
              "numeric",

            minute:
              "2-digit"
          },

          headerToolbar: {

            left:
              "prev,next today",

            center:
              "title",

            right:
              ""

          },

          buttonText: {
            today:
              "Today"
          },


          eventSources: [

            {
              url:
                "glaze-calendar.ics",

              format:
                "ics",

              className:
                "glaze-event"
            },

            {
              url:
                "bash-calendar.ics",

              format:
                "ics",

              className:
                "bash-event"
            }

          ],


          eventClassNames:
            function(info) {

              if(
                info.event.source &&
                info.event.source.url &&
                info.event.source.url.includes(
                  "bash-calendar"
                )
              ) {

                return [
                  "bash-event"
                ];

              }

              return [
                "glaze-event"
              ];

            }

        }
      );


    calendar.render();

  }
);

</script>

</body>

</html>
