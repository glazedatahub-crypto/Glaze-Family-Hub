<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Glaze Family Hub</title>

<script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.21/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/icalendar@6.1.21/index.global.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  color: #202124;
}

body {
  min-height: 100vh;

  background-image:
    linear-gradient(
      rgba(10,18,28,0.10),
      rgba(10,18,28,0.10)
    ),
    url("IMG_2348.png");

  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  background-attachment: fixed;

  padding: 10px 18px;
}

.hub {
  width: 100%;
  max-width: 1750px;
  margin: 0 auto;
}

.glass {
  background: rgba(255,255,255,0.76);
  border: 1px solid rgba(255,255,255,0.82);

  box-shadow:
    0 6px 22px rgba(0,0,0,0.12);

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.topbar {
  display: grid;

  grid-template-columns:
    255px minmax(420px,1fr) 125px 155px;

  gap: 10px;
  align-items: stretch;
  margin-bottom: 8px;
}

.date-box,
.title-box,
.weather-box,
.clock-box {
  border-radius: 17px;
  overflow: hidden;
}

.date-box {
  padding: 11px 18px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.day {
  font-size: 31px;
  font-weight: 900;
  line-height: 1;
}

.date {
  font-size: 15px;
  color: #555;
  margin-top: 7px;
}

.title-box {
  display: flex;
  justify-content: center;
  align-items: center;

  padding: 8px 20px;
  text-align: center;
}

.main-title {
  font-size: 36px;
  font-weight: 950;

  letter-spacing: 1.5px;
  line-height: 1;

  color: #171717;
}

.weather-box {
  display: flex;
  flex-direction: column;
  justify-content: center;

  text-align: center;
  padding: 8px;
}

.weather-main {
  font-size: 24px;
  font-weight: 900;
}

.weather-label {
  font-size: 10px;
  color: #666;
  margin-top: 2px;
}

.clock-box {
  display: flex;
  justify-content: center;
  align-items: center;

  padding: 8px;
}

.clock {
  font-size: 30px;
  font-weight: 900;
}

.cards {
  display: grid;

  grid-template-columns:
    repeat(5,minmax(0,1fr));

  gap: 8px;
  margin-bottom: 8px;
}

.card {
  min-height: 108px;

  border: 2px solid;
  border-radius: 17px;

  text-align: center;
  padding: 8px 6px;

  display: flex;
  flex-direction: column;
  justify-content: center;

  box-shadow:
    0 5px 14px rgba(0,0,0,0.10);

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.event-name {
  font-size: 17px;
  font-weight: 900;

  line-height: 1.1;
  min-height: 38px;

  display: flex;
  align-items: center;
  justify-content: center;
}

.days {
  font-size: 36px;
  font-weight: 900;

  line-height: 1;
  margin-top: 3px;
}

.days-label {
  font-size: 11px;
  font-weight: 700;

  margin-top: 2px;
  letter-spacing: .6px;
}

.event-date {
  font-size: 12px;
  font-weight: 700;

  margin-top: 3px;
  opacity: .85;
}

.mom {
  background: rgba(255,227,240,.80);
  border-color: #ff78b5;
  color: #a21858;
}

.daddy {
  background: rgba(239,255,214,.80);
  border-color: #9be000;
  color: #4d7300;
}

.ryder {
  background: rgba(229,235,255,.80);
  border-color: #4169e1;
  color: #183a9b;
}

.clyde {
  background: rgba(227,248,233,.80);
  border-color: #2e9d50;
  color: #186634;
}

.wyatt {
  background: rgba(255,228,228,.80);
  border-color: #e53935;
  color: #9e211f;
}

.charlotte {
  background: rgba(241,228,255,.80);
  border-color: #9b59d0;
  color: #63328b;
}

.halloween {
  background: rgba(255,240,223,.82);
  border-color: #ff8c00;
  color: #a35200;
}

.thanksgiving {
  background: rgba(255,241,227,.82);
  border-color: #c76b2b;
  color: #864011;
}

.christmas {
  background: rgba(232,246,236,.82);
  border-color: #2d8b57;
  color: #195638;
}

.newyear {
  background: rgba(230,239,255,.82);
  border-color: #4c7de8;
  color: #264b9b;
}

.calendar-panel {
  padding: 10px;
  border-radius: 18px;
  overflow: hidden;
}

#calendar {
  background: rgba(255,255,255,.95);
  border-radius: 13px;
  overflow: hidden;
  padding: 7px;
}

.fc .fc-toolbar {
  margin: 2px 4px 8px !important;
}

.fc .fc-toolbar-title {
  font-size: 28px !important;
  font-weight: 900 !important;
  color: #222 !important;
}

.fc .fc-button {
  background: #fff !important;
  color: #333 !important;

  border: 1px solid #c7c7c7 !important;

  font-weight: 800 !important;
  box-shadow: none !important;
}

.fc .fc-col-header-cell {
  background: #f3f5f8;
}

.fc .fc-col-header-cell-cushion {
  color: #333 !important;
  text-decoration: none !important;

  font-size: 15px !important;
  font-weight: 900 !important;

  padding: 7px 2px !important;
}

.fc .fc-daygrid-day {
  background: rgba(255,255,255,.90);
}

.fc .fc-daygrid-day-frame {
  min-height: 96px;
  padding-top: 2px;
}

.fc .fc-daygrid-day-top {
  min-height: 28px;
}

.fc .fc-daygrid-day-number {
  color: #333 !important;
  text-decoration: none !important;

  font-size: 17px !important;
  font-weight: 900 !important;

  padding: 6px 7px 4px !important;

  position: relative;
  z-index: 3;
}

.fc .fc-day-other {
  background: rgba(238,238,238,.66);
}

.fc .fc-day-other .fc-daygrid-day-number {
  opacity: .30;
}

.fc .fc-day-today {
  background: rgba(194,220,255,.96) !important;

  box-shadow:
    inset 0 0 0 4px #4385e8 !important;
}

.fc .fc-day-today .fc-daygrid-day-number {
  color: #174f9f !important;
  font-size: 19px !important;
}

.fc .fc-daygrid-event {
  border: none !important;
  background: transparent !important;

  margin: 2px 4px !important;
  padding: 0 !important;

  white-space: normal !important;
  overflow: visible !important;
}

.fc .fc-daygrid-day-events {
  margin-top: 2px !important;
}

.fc .fc-event-main {
  padding: 0 !important;
}

.custom-event {
  display: grid;

  grid-template-columns:
    auto auto 1fr;

  align-items: center;

  gap: 4px;

  width: 100%;

  border-radius: 6px;
  padding: 3px 5px;

  font-size: 11px;
  font-weight: 800;

  line-height: 1.12;
  overflow: hidden;
}

.event-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}

.custom-time {
  font-size: 9px;
  font-weight: 900;

  line-height: 1;

  white-space: nowrap;
  opacity: .90;
}

.custom-title {
  font-size: 11px;
  font-weight: 800;

  line-height: 1.12;

  white-space: normal;
  overflow: visible;
}

.custom-event.glaze {
  background: #dceaff;
  color: #1f4d8f;
}

.custom-event.glaze .event-dot {
  background: #4f8fe8;
}

.custom-event.bash {
  background: #e4f4e5;
  color: #245d2b;
}

.custom-event.bash .event-dot {
  background: #5dbd52;
}

.custom-event.personal {
  background: #ffe1ef;
  color: #9d285d;
}

.custom-event.personal .event-dot {
  background: #e35f9c;
}

.fc .fc-daygrid-more-link {
  font-size: 10px !important;
  font-weight: 900 !important;

  color: #315fa7 !important;

  padding-left: 5px;
}

.fc-theme-standard td,
.fc-theme-standard th {
  border-color: rgba(90,100,110,.24) !important;
}

@media (min-width:1200px) {

  body {
    padding: 10px 18px;
  }

  .hub {
    max-width: 1750px;
  }

  .fc .fc-daygrid-day-frame {
    min-height: 98px;
  }

}

</style>
</head>


<body>

<div class="hub">

<div class="topbar">

  <div class="date-box glass">

    <div
      class="day"
      id="day">
    </div>

    <div
      class="date"
      id="date">
    </div>

  </div>

  <div class="title-box glass">

    <div class="main-title">
      GLAZE FAMILY HUB
    </div>

  </div>

  <div class="weather-box glass">

    <div
      class="weather-main"
      id="weatherMain">
      --°
    </div>

    <div class="weather-label">
      Manvel
    </div>

  </div>

  <div class="clock-box glass">

    <div
      class="clock"
      id="clock">
    </div>

  </div>

</div>


<div
  class="cards"
  id="cards">
</div>


<div class="calendar-panel glass">

  <div id="calendar"></div>

</div>


</div>


<script>

function updateClock() {

  const now =
    new Date();

  document
    .getElementById("day")
    .textContent =
    now.toLocaleDateString(
      "en-US",
      {
        weekday: "long"
      }
    );

  document
    .getElementById("date")
    .textContent =
    now.toLocaleDateString(
      "en-US",
      {
        month: "long",
        day: "numeric",
        year: "numeric"
      }
    );

  document
    .getElementById("clock")
    .textContent =
    now.toLocaleTimeString(
      "en-US",
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );

}

updateClock();
setInterval(updateClock,30000);


function weatherIcon(code) {

  if (code === 0) return "☀️";

  if (
    code === 1 ||
    code === 2
  ) return "🌤️";

  if (code === 3) return "☁️";

  if (
    code === 45 ||
    code === 48
  ) return "🌫️";

  if (
    (code >= 51 && code <= 67) ||
    (code >= 80 && code <= 82)
  ) return "🌧️";

  if (
    code >= 71 &&
    code <= 77
  ) return "❄️";

  if (code >= 95) return "⛈️";

  return "🌤️";
}


async function updateWeather() {

  try {

    const response =
      await fetch(
        "https://api.open-meteo.com/v1/forecast?latitude=29.46&longitude=-95.36&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=America%2FChicago"
      );

    const data =
      await response.json();

    const temp =
      Math.round(
        data.current.temperature_2m
      );

    const icon =
      weatherIcon(
        data.current.weather_code
      );

    document
      .getElementById("weatherMain")
      .textContent =
      icon + " " + temp + "°";

  }

  catch(error) {

    document
      .getElementById("weatherMain")
      .textContent =
      "--°";

  }

}

updateWeather();
setInterval(updateWeather,900000);


const birthdays = [

  {
    name:"Mom",
    month:10,
    day:9,
    year:1996,
    className:"mom"
  },

  {
    name:"Daddy",
    month:11,
    day:11,
    year:1995,
    className:"daddy"
  },

  {
    name:"Ryder",
    month:10,
    day:18,
    year:2016,
    className:"ryder"
  },

  {
    name:"Clyde",
    month:4,
    day:21,
    year:2018,
    className:"clyde"
  },

  {
    name:"Wyatt",
    month:12,
    day:8,
    year:2019,
    className:"wyatt"
  },

  {
    name:"Charlotte",
    month:11,
    day:9,
    year:2021,
    className:"charlotte"
  }

];


function thanksgiving(year) {

  let d =
    new Date(
      year,
      10,
      1
    );

  while(
    d.getDay() !== 4
  ) {

    d.setDate(
      d.getDate() + 1
    );

  }

  d.setDate(
    d.getDate() + 21
  );

  return d;

}


function ordinal(number) {

  const lastTwo =
    number % 100;

  if(
    lastTwo >= 11 &&
    lastTwo <= 13
  ) {

    return number + "th";

  }

  switch(number % 10) {

    case 1:
      return number + "st";

    case 2:
      return number + "nd";

    case 3:
      return number + "rd";

    default:
      return number + "th";

  }

}


function upcomingEvents() {

  const now =
    new Date();

  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

  const events = [];


  birthdays.forEach(
    person => {

      let year =
        today.getFullYear();

      let eventDate =
        new Date(
          year,
          person.month - 1,
          person.day
        );

      if(
        eventDate < today
      ) {

        year++;

        eventDate =
          new Date(
            year,
            person.month - 1,
            person.day
          );

      }

      const age =
        year -
        person.year;

      events.push({

        name:
          person.name +
          "'s " +
          ordinal(age) +
          " Birthday",

        date:
          eventDate,

        className:
          person.className

      });

    }
  );


  const holidays = [

    {
      name:"Halloween",
      month:10,
      day:31,
      className:"halloween"
    },

    {
      name:"Christmas",
      month:12,
      day:25,
      className:"christmas"
    }

  ];


  holidays.forEach(
    holiday => {

      let year =
        today.getFullYear();

      let eventDate =
        new Date(
          year,
          holiday.month - 1,
          holiday.day
        );

      if(
        eventDate < today
      ) {

        eventDate =
          new Date(
            year + 1,
            holiday.month - 1,
            holiday.day
          );

      }

      events.push({

        name:
          holiday.name,

        date:
          eventDate,

        className:
          holiday.className

      });

    }
  );


  let thanksgivingDate =
    thanksgiving(
      today.getFullYear()
    );

  if(
    thanksgivingDate <
    today
  ) {

    thanksgivingDate =
      thanksgiving(
        today.getFullYear() + 1
      );

  }

  events.push({

    name:
      "Thanksgiving",

    date:
      thanksgivingDate,

    className:
      "thanksgiving"

  });


  const newYear =
    new Date(
      today.getFullYear() + 1,
      0,
      1
    );

  events.push({

    name:
      "New Year's",

    date:
      newYear,

    className:
      "newyear"

  });


  events.sort(
    (a,b) =>
      a.date -
      b.date
  );


  return events.slice(
    0,
    5
  );

}


function renderCountdowns() {

  const now =
    new Date();

  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

  const cards =
    document.getElementById(
      "cards"
    );

  cards.innerHTML = "";


  upcomingEvents()
    .forEach(
      event => {

        const days =
          Math.round(
            (
              event.date -
              today
            )
            /
            86400000
          );

        const dateText =
          event.date
            .toLocaleDateString(
              "en-US",
              {
                month:"long",
                day:"numeric"
              }
            );

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "card " +
          event.className;

        card.innerHTML = `

          <div class="event-name">
            ${event.name}
          </div>

          <div class="days">
            ${days}
          </div>

          <div class="days-label">
            DAYS
          </div>

          <div class="event-date">
            ${dateText}
          </div>

        `;

        cards.appendChild(
          card
        );

      }
    );

}

renderCountdowns();


document.addEventListener(
  "DOMContentLoaded",
  function() {

    const calendarEl =
      document.getElementById(
        "calendar"
      );


    const calendar =
      new FullCalendar.Calendar(
        calendarEl,
        {

          initialView:
            "dayGridMonth",

          timeZone:
            "America/Chicago",

          firstDay:
            0,

          fixedWeekCount:
            false,

          showNonCurrentDates:
            true,

          height:
            "auto",

          dayMaxEvents:
            4,

          displayEventTime:
            true,

          eventTimeFormat: {
            hour: "numeric",
            minute: "2-digit",
            omitZeroMinute: true,
            meridiem: "short"
          },

          headerToolbar: {

            left:
              "prev,next today",

            center:
              "title",

            right:
              ""

          },

          buttonText: {

            today:
              "Today"

          },

          eventSources: [

            {
              url:
                "glaze-calendar.ics",

              format:
                "ics",

              eventDataTransform:
                function(eventData) {

                  eventData.extendedProps =
                    {
                      ...(eventData.extendedProps || {}),
                      calendarType:
                        "glaze"
                    };

                  return eventData;

                }

            },

            {
              url:
                "bash-calendar.ics",

              format:
                "ics",

              eventDataTransform:
                function(eventData) {

                  eventData.extendedProps =
                    {
                      ...(eventData.extendedProps || {}),
                      calendarType:
                        "bash"
                    };

                  return eventData;

                }

            },

            {
              url:
                "savanna-calendar.ics",

              format:
                "ics",

              eventDataTransform:
                function(eventData) {

                  eventData.extendedProps =
                    {
                      ...(eventData.extendedProps || {}),
                      calendarType:
                        "personal"
                    };

                  return eventData;

                }

            }

          ],

          eventContent:
            function(arg) {

              const typeClass =
                arg.event.extendedProps.calendarType
                  ||
                  "glaze";


              const wrap =
                document.createElement(
                  "div"
                );

              wrap.className =
                "custom-event " +
                typeClass;


              const dot =
                document.createElement(
                  "span"
                );

              dot.className =
                "event-dot";


              const time =
                document.createElement(
                  "span"
                );

              time.textContent =
  arg.event.allDay
    ?
    ""
    :
    arg.event.start.toLocaleTimeString(
      "en-US",
      {
        timeZone: "America/Chicago",
        hour: "numeric",
        minute: "2-digit"
      }
    );


              const title =
                document.createElement(
                  "span"
                );

              title.className =
                "custom-title";

              title.textContent =
                arg.event.title;


              wrap.appendChild(
                dot
              );

              wrap.appendChild(
                time
              );

              wrap.appendChild(
                title
              );


              return {
                domNodes:
                  [
                    wrap
                  ]
              };

            }

        }
      );


    calendar.render();

  }
);

</script>

</body>
</html>
