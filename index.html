<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Glaze Family Hub</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  color: #202124;
}

body {
  min-height: 100vh;

  background-image:
    linear-gradient(
      rgba(20,25,35,0.18),
      rgba(20,25,35,0.18)
    ),
    url("IMG_2348.png");

  background-size: cover;
  background-position: center center;
  background-attachment: fixed;
  background-repeat: no-repeat;

  padding: 20px;
}

.hub {
  width: 100%;
  max-width: 1600px;
  margin: 0 auto;
}


/* GLASS EFFECT */

.glass {
  background: rgba(255,255,255,0.76);

  border: 1px solid rgba(255,255,255,0.80);

  box-shadow:
    0 8px 30px rgba(0,0,0,0.13);

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}


/* TOP */

.topbar {
  display: grid;

  grid-template-columns:
    minmax(300px,1fr)
    auto
    auto;

  align-items: center;

  gap: 16px;

  margin-bottom: 12px;
}

.date-box,
.weather-box,
.clock-box {
  border-radius: 20px;
}

.date-box {
  padding: 16px 22px;
}

.hub-name {
  font-size: 16px;
  font-weight: 800;

  letter-spacing: 2px;

  color: #555;

  margin-bottom: 5px;
}

.day {
  font-size: 36px;
  line-height: 1;
  font-weight: 800;
}

.date {
  font-size: 17px;
  color: #555;
  margin-top: 7px;
}

.weather-box {
  min-width: 145px;

  text-align: center;

  padding: 14px 18px;
}

.weather-main {
  font-size: 30px;
  font-weight: 800;
}

.weather-label {
  font-size: 13px;
  color: #666;
  margin-top: 3px;
}

.clock-box {
  min-width: 185px;

  text-align: center;

  padding: 17px 18px;
}

.clock {
  font-size: 38px;
  line-height: 1;
  font-weight: 800;
}


/* COMING UP */

.coming-title {
  display: inline-block;

  padding: 8px 16px;

  border-radius: 16px;

  margin-bottom: 9px;

  font-size: 23px;
  font-weight: 800;
}


/* COUNTDOWN CARDS */

.cards {
  display: grid;

  grid-template-columns:
    repeat(5,minmax(0,1fr));

  gap: 11px;

  margin-bottom: 13px;
}

.card {
  min-height: 160px;

  border: 2px solid;

  border-radius: 20px;

  text-align: center;

  padding: 11px 7px 9px;

  display: flex;

  flex-direction: column;

  justify-content: center;

  box-shadow:
    0 7px 18px rgba(0,0,0,0.10);

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.emoji {
  font-size: 22px;
  margin-bottom: 4px;
}

.event-name {
  font-size: 16px;
  font-weight: 800;

  line-height: 1.2;

  min-height: 38px;

  display: flex;

  align-items: center;
  justify-content: center;
}

.days {
  font-size: 35px;
  font-weight: 900;

  line-height: 1;

  margin-top: 6px;
}

.days-label {
  font-size: 11px;

  margin-top: 4px;

  letter-spacing: .5px;
}

.event-date {
  font-size: 12px;

  margin-top: 5px;

  opacity: .78;
}


/* FAMILY COLORS */

.mom {
  background: rgba(255,227,240,.86);
  border-color: #ff78b5;
  color: #a21858;
}

.daddy {
  background: rgba(239,255,214,.86);
  border-color: #9be000;
  color: #4d7300;
}

.ryder {
  background: rgba(229,235,255,.86);
  border-color: #4169e1;
  color: #183a9b;
}

.clyde {
  background: rgba(227,248,233,.86);
  border-color: #2e9d50;
  color: #186634;
}

.wyatt {
  background: rgba(255,228,228,.86);
  border-color: #e53935;
  color: #9e211f;
}

.charlotte {
  background: rgba(241,228,255,.86);
  border-color: #9b59d0;
  color: #63328b;
}


/* HOLIDAYS */

.halloween {
  background: rgba(255,240,223,.88);
  border-color: #ff8c00;
  color: #a35200;
}

.thanksgiving {
  background: rgba(255,241,227,.88);
  border-color: #c76b2b;
  color: #864011;
}

.christmas {
  background: rgba(232,246,236,.88);
  border-color: #2d8b57;
  color: #195638;
}

.newyear {
  background: rgba(230,239,255,.88);
  border-color: #4c7de8;
  color: #264b9b;
}


/* CALENDAR */

.calendar-panel {
  padding: 10px;

  border-radius: 22px;

  overflow: hidden;
}

.calendar-title {
  font-size: 20px;
  font-weight: 800;

  padding: 2px 5px 8px;
}

.calendar-wrap {
  width: 100%;

  height: 580px;

  overflow: hidden;

  border-radius: 15px;

  background: rgba(255,255,255,.92);
}

.calendar-wrap iframe {
  display: block;

  width: 100%;
  height: 100%;

  border: 0;
}


/* TV */

@media (min-width:1200px) {

  body {
    padding: 16px 28px;
  }

  .hub {
    max-width: 1650px;
  }

  .calendar-wrap {
    height: 580px;
  }

}


/* SMALL SCREEN */

@media (max-width:900px) {

  body {
    padding: 10px;
  }

  .topbar {
    grid-template-columns:
      1fr auto auto;

    gap: 7px;
  }

  .date-box {
    padding: 12px;
  }

  .hub-name {
    font-size: 12px;
  }

  .day {
    font-size: 28px;
  }

  .date {
    font-size: 14px;
  }

  .weather-box {
    min-width: 105px;

    padding: 11px 8px;
  }

  .weather-main {
    font-size: 24px;
  }

  .clock-box {
    min-width: 135px;

    padding: 13px 8px;
  }

  .clock {
    font-size: 29px;
  }

  .cards {
    gap: 6px;
  }

  .card {
    min-height: 145px;

    border-radius: 14px;

    padding-left: 3px;
    padding-right: 3px;
  }

  .event-name {
    font-size: 13px;
  }

  .days {
    font-size: 29px;
  }

  .calendar-wrap {
    height: 540px;
  }

}

</style>
</head>


<body>

<div class="hub">


<!-- DATE / WEATHER / CLOCK -->

<div class="topbar">

  <div class="date-box glass">

    <div class="hub-name">
      GLAZE FAMILY HUB
    </div>

    <div class="day" id="day"></div>

    <div class="date" id="date"></div>

  </div>


  <div class="weather-box glass">

    <div
      class="weather-main"
      id="weatherMain">
      🌤️ --°
    </div>

    <div class="weather-label">
      Manvel
    </div>

  </div>


  <div class="clock-box glass">

    <div
      class="clock"
      id="clock">
    </div>

  </div>

</div>



<!-- COUNTDOWNS -->

<div class="coming-title glass">
  🎉 Coming Up
</div>


<div
  class="cards"
  id="cards">
</div>



<!-- CALENDAR -->

<div class="calendar-panel glass">

  <div class="calendar-title">
    📅 Our Calendar
  </div>

  <div class="calendar-wrap">

    <iframe

      src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=America%2FChicago&showPrint=0&showTabs=0&showCalendars=0&showTitle=0&mode=MONTH&src=glazedatahub%40gmail.com&src=bashhomeschoolers%40gmail.com"

      width="100%"

      height="600"

      frameborder="0"

      scrolling="no">

    </iframe>

  </div>

</div>


</div>



<script>


/* CLOCK */

function updateClock() {

  const now =
    new Date();

  document
    .getElementById("day")
    .textContent =

    now.toLocaleDateString(
      "en-US",
      {
        weekday: "long"
      }
    );


  document
    .getElementById("date")
    .textContent =

    now.toLocaleDateString(
      "en-US",
      {
        month: "long",
        day: "numeric",
        year: "numeric"
      }
    );


  document
    .getElementById("clock")
    .textContent =

    now.toLocaleTimeString(
      "en-US",
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );

}


updateClock();

setInterval(
  updateClock,
  30000
);



/* WEATHER */

function weatherIcon(code) {

  if (code === 0)
    return "☀️";

  if (
    code === 1 ||
    code === 2
  )
    return "🌤️";

  if (code === 3)
    return "☁️";

  if (
    code === 45 ||
    code === 48
  )
    return "🌫️";

  if (
    (code >= 51 && code <= 67) ||
    (code >= 80 && code <= 82)
  )
    return "🌧️";

  if (
    code >= 71 &&
    code <= 77
  )
    return "❄️";

  if (code >= 95)
    return "⛈️";

  return "🌤️";

}



async function updateWeather() {

  try {

    const response =
      await fetch(
        "https://api.open-meteo.com/v1/forecast?latitude=29.46&longitude=-95.36&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=America%2FChicago"
      );


    const data =
      await response.json();


    const temp =
      Math.round(
        data.current.temperature_2m
      );


    const icon =
      weatherIcon(
        data.current.weather_code
      );


    document
      .getElementById(
        "weatherMain"
      )
      .textContent =

      icon +
      " " +
      temp +
      "°";

  }

  catch(error) {

    document
      .getElementById(
        "weatherMain"
      )
      .textContent =
      "🌤️ --°";

  }

}


updateWeather();

setInterval(
  updateWeather,
  900000
);



/* BIRTHDAYS */

const birthdays = [

  {
    name: "Mom",
    month: 10,
    day: 9,
    year: 1996,
    className: "mom"
  },

  {
    name: "Daddy",
    month: 11,
    day: 11,
    year: 1995,
    className: "daddy"
  },

  {
    name: "Ryder",
    month: 10,
    day: 18,
    year: 2016,
    className: "ryder"
  },

  {
    name: "Clyde",
    month: 4,
    day: 21,
    year: 2018,
    className: "clyde"
  },

  {
    name: "Wyatt",
    month: 12,
    day: 8,
    year: 2019,
    className: "wyatt"
  },

  {
    name: "Charlotte",
    month: 11,
    day: 9,
    year: 2021,
    className: "charlotte"
  }

];



function thanksgiving(year) {

  let d =
    new Date(
      year,
      10,
      1
    );


  while(
    d.getDay() !== 4
  ) {

    d.setDate(
      d.getDate() + 1
    );

  }


  d.setDate(
    d.getDate() + 21
  );


  return d;

}



function ordinal(number) {

  const lastTwo =
    number % 100;


  if(
    lastTwo >= 11 &&
    lastTwo <= 13
  ) {

    return number + "th";

  }


  switch(
    number % 10
  ) {

    case 1:
      return number + "st";

    case 2:
      return number + "nd";

    case 3:
      return number + "rd";

    default:
      return number + "th";

  }

}



/* UPCOMING EVENTS */

function upcomingEvents() {

  const now =
    new Date();


  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );


  const events = [];


  birthdays.forEach(
    person => {

      let year =
        today.getFullYear();


      let eventDate =
        new Date(
          year,
          person.month - 1,
          person.day
        );


      if(
        eventDate < today
      ) {

        year++;


        eventDate =
          new Date(
            year,
            person.month - 1,
            person.day
          );

      }


      const age =
        year -
        person.year;


      events.push({

        name:
          person.name +
          "'s " +
          ordinal(age) +
          " Birthday",

        date:
          eventDate,

        className:
          person.className,

        emoji:
          "🎂"

      });

    }
  );



  const holidays = [

    {
      name: "Halloween",
      month: 10,
      day: 31,
      className: "halloween",
      emoji: "🎃"
    },

    {
      name: "Christmas",
      month: 12,
      day: 25,
      className: "christmas",
      emoji: "🎄"
    }

  ];



  holidays.forEach(
    holiday => {

      let year =
        today.getFullYear();


      let eventDate =
        new Date(
          year,
          holiday.month - 1,
          holiday.day
        );


      if(
        eventDate < today
      ) {

        eventDate =
          new Date(
            year + 1,
            holiday.month - 1,
            holiday.day
          );

      }


      events.push({

        name:
          holiday.name,

        date:
          eventDate,

        className:
          holiday.className,

        emoji:
          holiday.emoji

      });

    }
  );



  let thanksgivingDate =
    thanksgiving(
      today.getFullYear()
    );


  if(
    thanksgivingDate <
    today
  ) {

    thanksgivingDate =
      thanksgiving(
        today.getFullYear() + 1
      );

  }


  events.push({

    name:
      "Thanksgiving",

    date:
      thanksgivingDate,

    className:
      "thanksgiving",

    emoji:
      "🦃"

  });



  const newYear =
    new Date(
      today.getFullYear() + 1,
      0,
      1
    );


  events.push({

    name:
      "New Year's",

    date:
      newYear,

    className:
      "newyear",

    emoji:
      "🎆"

  });



  events.sort(
    (a,b) =>
      a.date -
      b.date
  );


  return events.slice(
    0,
    5
  );

}



/* DISPLAY COUNTDOWNS */

function renderCountdowns() {

  const now =
    new Date();


  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );


  const cards =
    document.getElementById(
      "cards"
    );


  cards.innerHTML =
    "";


  upcomingEvents()
    .forEach(
      event => {


        const days =
          Math.round(
            (
              event.date -
              today
            )
            /
            86400000
          );


        const dateText =
          event.date
            .toLocaleDateString(
              "en-US",
              {
                month:
                  "long",

                day:
                  "numeric"
              }
            );


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "card " +
          event.className;


        card.innerHTML = `

          <div class="emoji">
            ${event.emoji}
          </div>

          <div class="event-name">
            ${event.name}
          </div>

          <div class="days">
            ${days}
          </div>

          <div class="days-label">
            DAYS
          </div>

          <div class="event-date">
            ${dateText}
          </div>

        `;


        cards.appendChild(
          card
        );

      }
    );

}


renderCountdowns();


</script>

</body>
</html>
