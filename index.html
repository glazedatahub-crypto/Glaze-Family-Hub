<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  font-family: Arial, sans-serif;
  background: white;
  color: #222;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 16px;
}

.hub-title {
  font-size: 18px;
  font-weight: 700;
  color: #777;
  margin-bottom: 3px;
  letter-spacing: .5px;
}

.day {
  font-size: 34px;
  font-weight: 700;
}

.date {
  font-size: 18px;
  color: #666;
  margin-top: 3px;
}

.right-info {
  display: flex;
  align-items: center;
  gap: 28px;
}

.weather {
  text-align: center;
}

.weather-main {
  font-size: 30px;
  font-weight: 700;
  white-space: nowrap;
}

.weather-city {
  font-size: 13px;
  color: #777;
  margin-top: 2px;
}

.clock {
  font-size: 38px;
  font-weight: 700;
  white-space: nowrap;
}

h2 {
  margin: 0 0 10px;
  font-size: 22px;
}

#countdowns {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}

.card {
  border-radius: 16px;
  padding: 14px 8px;
  text-align: center;
  border: 2px solid transparent;
}

.emoji { font-size: 24px; }

.name {
  font-size: 15px;
  font-weight: bold;
  margin-top: 4px;
  min-height: 36px;
}

.days {
  font-size: 32px;
  font-weight: bold;
  margin-top: 5px;
}

.label {
  font-size: 12px;
  opacity: .72;
}

.event-date {
  font-size: 12px;
  opacity: .7;
  margin-top: 4px;
}

/* FAMILY COLORS */

.mom {
  background: #ffe3f0;
  border-color: #ff78b5;
  color: #a21858;
}

.daddy {
  background: #efffd6;
  border-color: #9be000;
  color: #4d7300;
}

.ryder {
  background: #e5ebff;
  border-color: #4169e1;
  color: #183a9b;
}

.clyde {
  background: #e3f8e9;
  border-color: #2e9d50;
  color: #186634;
}

.wyatt {
  background: #ffe4e4;
  border-color: #e53935;
  color: #9e211f;
}

.charlotte {
  background: #f1e4ff;
  border-color: #9b59d0;
  color: #63328b;
}

/* HOLIDAYS */

.halloween {
  background: #fff0df;
  border-color: #ff8c00;
  color: #a35200;
}

.thanksgiving {
  background: #fff1e3;
  border-color: #c76b2b;
  color: #864011;
}

.christmas {
  background: #e8f6ec;
  border-color: #2d8b57;
  color: #195638;
}

.newyear {
  background: #e6efff;
  border-color: #4c7de8;
  color: #264b9b;
}

@media (max-width: 700px) {
  .topbar {
    align-items: flex-start;
  }

  .right-info {
    gap: 10px;
  }

  .day { font-size: 26px; }
  .clock { font-size: 28px; }
  .weather-main { font-size: 24px; }

  #countdowns {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<div class="topbar">

  <div>
    <div class="hub-title">GLAZE FAMILY HUB</div>
    <div id="day" class="day"></div>
    <div id="date" class="date"></div>
  </div>

  <div class="right-info">

    <div class="weather">
      <div id="weatherMain" class="weather-main">🌤️ --°</div>
      <div class="weather-city">Manvel</div>
    </div>

    <div id="clock" class="clock"></div>

  </div>

</div>

<h2>🎉 Coming Up</h2>

<div id="countdowns"></div>

<script>

const birthdays = [
  {name:"Mom", month:10, day:9, year:1996, className:"mom"},
  {name:"Daddy", month:11, day:11, year:1995, className:"daddy"},
  {name:"Ryder", month:10, day:18, year:2016, className:"ryder"},
  {name:"Clyde", month:4, day:21, year:2018, className:"clyde"},
  {name:"Wyatt", month:12, day:8, year:2019, className:"wyatt"},
  {name:"Charlotte", month:11, day:9, year:2021, className:"charlotte"}
];

function thanksgiving(year) {
  let d = new Date(year, 10, 1);

  while (d.getDay() !== 4) {
    d.setDate(d.getDate() + 1);
  }

  d.setDate(d.getDate() + 21);
  return d;
}

function ordinal(number) {

  const mod100 = number % 100;

  if (mod100 >= 11 && mod100 <= 13) {
    return number + "th";
  }

  switch(number % 10) {
    case 1: return number + "st";
    case 2: return number + "nd";
    case 3: return number + "rd";
    default: return number + "th";
  }
}

function getEvents() {

  const now = new Date();
  now.setHours(0,0,0,0);

  const year = now.getFullYear();
  let events = [];

  birthdays.forEach(person => {

    let eventDate =
      new Date(year, person.month - 1, person.day);

    if (eventDate < now) {
      eventDate =
        new Date(year + 1, person.month - 1, person.day);
    }

    const age =
      eventDate.getFullYear() - person.year;

    events.push({
      emoji:"🎂",
      title:person.name + "'s " + ordinal(age) + " Birthday",
      date:eventDate,
      className:person.className
    });

  });

  const holidays = [
    {
      emoji:"🎃",
      title:"Halloween",
      className:"halloween",
      getDate:y => new Date(y,9,31)
    },
    {
      emoji:"🦃",
      title:"Thanksgiving",
      className:"thanksgiving",
      getDate:y => thanksgiving(y)
    },
    {
      emoji:"🎄",
      title:"Christmas",
      className:"christmas",
      getDate:y => new Date(y,11,25)
    },
    {
      emoji:"🎆",
      title:"New Year's",
      className:"newyear",
      getDate:y => new Date(y,0,1)
    }
  ];

  holidays.forEach(holiday => {

    let eventDate =
      holiday.getDate(year);

    if (eventDate < now) {
      eventDate =
        holiday.getDate(year + 1);
    }

    events.push({
      emoji:holiday.emoji,
      title:holiday.title,
      date:eventDate,
      className:holiday.className
    });

  });

  events.forEach(event => {
    event.days =
      Math.round((event.date - now) / 86400000);
  });

  events.sort((a,b) => a.days - b.days);

  return events.slice(0,5);
}

function displayEvents() {

  const container =
    document.getElementById("countdowns");

  container.innerHTML = "";

  getEvents().forEach(event => {

    const card =
      document.createElement("div");

    card.className =
      "card " + event.className;

    const dateText =
      event.date.toLocaleDateString(
        "en-US",
        {month:"long", day:"numeric"}
      );

    card.innerHTML = `
      <div class="emoji">${event.emoji}</div>
      <div class="name">${event.title}</div>
      <div class="days">${event.days}</div>
      <div class="label">
        ${event.days === 1 ? "DAY" : "DAYS"}
      </div>
      <div class="event-date">${dateText}</div>
    `;

    container.appendChild(card);
  });
}

function updateClock() {

  const now = new Date();

  document.getElementById("day").textContent =
    now.toLocaleDateString(
      "en-US",
      {weekday:"long"}
    );

  document.getElementById("date").textContent =
    now.toLocaleDateString(
      "en-US",
      {
        month:"long",
        day:"numeric",
        year:"numeric"
      }
    );

  document.getElementById("clock").textContent =
    now.toLocaleTimeString(
      "en-US",
      {
        hour:"numeric",
        minute:"2-digit"
      }
    );
}

/* LIVE MANVEL WEATHER */

function weatherIcon(code) {

  if (code === 0) return "☀️";

  if (code === 1 || code === 2)
    return "🌤️";

  if (code === 3)
    return "☁️";

  if (code === 45 || code === 48)
    return "🌫️";

  if (
    (code >= 51 && code <= 67) ||
    (code >= 80 && code <= 82)
  )
    return "🌧️";

  if (code >= 71 && code <= 77)
    return "❄️";

  if (code >= 95)
    return "⛈️";

  return "🌤️";
}

async function updateWeather() {

  try {

    const response = await fetch(
      "https://api.open-meteo.com/v1/forecast?latitude=29.46&longitude=-95.36&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=America%2FChicago"
    );

    const data = await response.json();

    const temp =
      Math.round(data.current.temperature_2m);

    const icon =
      weatherIcon(data.current.weather_code);

    document.getElementById("weatherMain").textContent =
      icon + " " + temp + "°";

  } catch (error) {

    document.getElementById("weatherMain").textContent =
      "🌤️ --°";

  }
}

displayEvents();
updateClock();
updateWeather();

setInterval(updateClock, 30000);

/* Refresh weather every 15 minutes */
setInterval(updateWeather, 900000);

</script>

</body>
</html>
