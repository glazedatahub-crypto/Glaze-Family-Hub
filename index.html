<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Glaze Family Hub</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: white;
  font-family: Arial, Helvetica, sans-serif;
  color: #202124;
}

body {
  padding: 18px 22px 8px;
}

.hub {
  width: 100%;
  max-width: 1500px;
  margin: auto;
}


/* =========================
   TOP
========================= */

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 25px;
  margin-bottom: 12px;
}

.hub-name {
  font-size: 17px;
  font-weight: 700;
  color: #777;
  letter-spacing: .4px;
  margin-bottom: 4px;
}

.day {
  font-size: 34px;
  line-height: 1;
  font-weight: 750;
}

.date {
  font-size: 18px;
  color: #666;
  margin-top: 7px;
}

.right-info {
  display: flex;
  align-items: center;
  gap: 32px;
  white-space: nowrap;
}

.weather {
  text-align: center;
}

.weather-main {
  font-size: 30px;
  font-weight: 750;
}

.weather-label {
  font-size: 13px;
  color: #777;
  margin-top: 3px;
}

.clock {
  font-size: 38px;
  font-weight: 750;
}


/* =========================
   COMING UP
========================= */

.coming-title {
  font-size: 23px;
  font-weight: 750;
  margin: 8px 0 11px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 11px;
  margin-bottom: 15px;
}

.card {
  min-height: 165px;

  border: 2px solid;
  border-radius: 17px;

  text-align: center;

  padding: 12px 7px 9px;

  display: flex;
  flex-direction: column;
  justify-content: center;
}

.emoji {
  font-size: 21px;
  margin-bottom: 5px;
}

.event-name {
  font-size: 16px;
  font-weight: 750;
  line-height: 1.2;

  min-height: 38px;

  display: flex;
  align-items: center;
  justify-content: center;
}

.days {
  font-size: 34px;
  font-weight: 800;
  line-height: 1;
  margin-top: 7px;
}

.days-label {
  font-size: 11px;
  margin-top: 4px;
}

.event-date {
  font-size: 12px;
  margin-top: 6px;
  opacity: .75;
}


/* =========================
   FAMILY COLORS
========================= */

.mom {
  background: #ffe3f0;
  border-color: #ff78b5;
  color: #a21858;
}

.daddy {
  background: #efffd6;
  border-color: #9be000;
  color: #4d7300;
}

.ryder {
  background: #e5ebff;
  border-color: #4169e1;
  color: #183a9b;
}

.clyde {
  background: #e3f8e9;
  border-color: #2e9d50;
  color: #186634;
}

.wyatt {
  background: #ffe4e4;
  border-color: #e53935;
  color: #9e211f;
}

.charlotte {
  background: #f1e4ff;
  border-color: #9b59d0;
  color: #63328b;
}


/* =========================
   HOLIDAY COLORS
========================= */

.halloween {
  background: #fff0df;
  border-color: #ff8c00;
  color: #a35200;
}

.thanksgiving {
  background: #fff1e3;
  border-color: #c76b2b;
  color: #864011;
}

.christmas {
  background: #e8f6ec;
  border-color: #2d8b57;
  color: #195638;
}

.newyear {
  background: #e6efff;
  border-color: #4c7de8;
  color: #264b9b;
}


/* =========================
   GOOGLE CALENDAR
========================= */

.calendar-wrap {
  width: 100%;
  height: 600px;

  border: 1px solid #e1e4e8;
  border-radius: 12px;

  overflow: hidden;
  background: white;
}

.calendar-wrap iframe {
  display: block;

  width: 100%;
  height: 100%;

  border: 0;
}


/* =========================
   SMALLER SCREENS
========================= */

@media (max-width: 900px) {

  body {
    padding: 14px;
  }

  .day {
    font-size: 30px;
  }

  .clock {
    font-size: 32px;
  }

  .right-info {
    gap: 20px;
  }

  .cards {
    gap: 7px;
  }

  .card {
    min-height: 155px;
    padding-left: 4px;
    padding-right: 4px;
  }

  .event-name {
    font-size: 14px;
  }

  .calendar-wrap {
    height: 570px;
  }
}

</style>

</head>


<body>

<div class="hub">


<!-- =========================
     HEADER
========================= -->

<div class="topbar">

  <div>

    <div class="hub-name">
      GLAZE FAMILY HUB
    </div>

    <div
      class="day"
      id="day">
    </div>

    <div
      class="date"
      id="date">
    </div>

  </div>


  <div class="right-info">

    <div class="weather">

      <div
        class="weather-main"
        id="weatherMain">
        🌤️ --°
      </div>

      <div class="weather-label">
        Manvel
      </div>

    </div>


    <div
      class="clock"
      id="clock">
    </div>

  </div>

</div>


<!-- =========================
     COUNTDOWNS
========================= -->

<div class="coming-title">
  🎉 Coming Up
</div>

<div
  class="cards"
  id="cards">
</div>


<!-- =========================
     GOOGLE CALENDAR
========================= -->

<div class="calendar-wrap">

<iframe

src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=America%2FChicago&showPrint=0&showTabs=0&showCalendars=0&showTitle=0&mode=MONTH&src=glazedatahub%40gmail.com&src=bashhomeschoolers%40gmail.com"

style="border:0"

width="100%"

height="600"

frameborder="0"

scrolling="no">

</iframe>

</div>


</div>



<script>


/* =========================
   DATE + CLOCK
========================= */

function updateClock() {

  const now =
    new Date();


  document
    .getElementById("day")
    .textContent =

    now.toLocaleDateString(
      "en-US",
      {
        weekday: "long"
      }
    );


  document
    .getElementById("date")
    .textContent =

    now.toLocaleDateString(
      "en-US",
      {
        month: "long",
        day: "numeric",
        year: "numeric"
      }
    );


  document
    .getElementById("clock")
    .textContent =

    now.toLocaleTimeString(
      "en-US",
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );

}


updateClock();

setInterval(
  updateClock,
  30000
);



/* =========================
   WEATHER
========================= */

function weatherIcon(code) {

  if (code === 0)
    return "☀️";


  if (
    code === 1 ||
    code === 2
  )
    return "🌤️";


  if (code === 3)
    return "☁️";


  if (
    code === 45 ||
    code === 48
  )
    return "🌫️";


  if (
    (code >= 51 && code <= 67) ||
    (code >= 80 && code <= 82)
  )
    return "🌧️";


  if (
    code >= 71 &&
    code <= 77
  )
    return "❄️";


  if (code >= 95)
    return "⛈️";


  return "🌤️";
}



async function updateWeather() {

  try {

    const response =
      await fetch(

        "https://api.open-meteo.com/v1/forecast?latitude=29.46&longitude=-95.36&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=America%2FChicago"

      );


    const data =
      await response.json();


    const temp =
      Math.round(
        data.current.temperature_2m
      );


    const icon =
      weatherIcon(
        data.current.weather_code
      );


    document
      .getElementById(
        "weatherMain"
      )
      .textContent =

      icon +
      " " +
      temp +
      "°";


  }

  catch (error) {

    document
      .getElementById(
        "weatherMain"
      )
      .textContent =
      "🌤️ --°";

  }

}


updateWeather();


setInterval(
  updateWeather,
  900000
);



/* =========================
   BIRTHDAYS
========================= */

const birthdays = [

  {
    name: "Mom",
    month: 10,
    day: 9,
    year: 1996,
    className: "mom"
  },

  {
    name: "Daddy",
    month: 11,
    day: 11,
    year: 1995,
    className: "daddy"
  },

  {
    name: "Ryder",
    month: 10,
    day: 18,
    year: 2016,
    className: "ryder"
  },

  {
    name: "Clyde",
    month: 4,
    day: 21,
    year: 2018,
    className: "clyde"
  },

  {
    name: "Wyatt",
    month: 12,
    day: 8,
    year: 2019,
    className: "wyatt"
  },

  {
    name: "Charlotte",
    month: 11,
    day: 9,
    year: 2021,
    className: "charlotte"
  }

];



/* =========================
   THANKSGIVING
========================= */

function thanksgiving(year) {

  let d =
    new Date(
      year,
      10,
      1
    );


  while (
    d.getDay() !== 4
  ) {

    d.setDate(
      d.getDate() + 1
    );

  }


  d.setDate(
    d.getDate() + 21
  );


  return d;

}



/* =========================
   ORDINALS
========================= */

function ordinal(number) {

  const lastTwo =
    number % 100;


  if (
    lastTwo >= 11 &&
    lastTwo <= 13
  ) {

    return number + "th";

  }


  switch (
    number % 10
  ) {

    case 1:
      return number + "st";

    case 2:
      return number + "nd";

    case 3:
      return number + "rd";

    default:
      return number + "th";

  }

}



/* =========================
   UPCOMING EVENTS
========================= */

function upcomingEvents() {

  const now =
    new Date();


  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );


  const events = [];



  birthdays.forEach(
    person => {

      let year =
        today.getFullYear();


      let eventDate =
        new Date(
          year,
          person.month - 1,
          person.day
        );


      if (
        eventDate < today
      ) {

        year++;


        eventDate =
          new Date(
            year,
            person.month - 1,
            person.day
          );

      }


      const age =
        year -
        person.year;


      events.push({

        name:
          person.name +
          "'s " +
          ordinal(age) +
          " Birthday",

        date:
          eventDate,

        className:
          person.className,

        emoji:
          "🎂"

      });

    }
  );



  const holidays = [

    {

      name:
        "Halloween",

      month:
        10,

      day:
        31,

      className:
        "halloween",

      emoji:
        "🎃"

    },


    {

      name:
        "Christmas",

      month:
        12,

      day:
        25,

      className:
        "christmas",

      emoji:
        "🎄"

    }

  ];



  holidays.forEach(
    holiday => {

      let year =
        today.getFullYear();


      let eventDate =
        new Date(
          year,
          holiday.month - 1,
          holiday.day
        );


      if (
        eventDate < today
      ) {

        eventDate =
          new Date(
            year + 1,
            holiday.month - 1,
            holiday.day
          );

      }


      events.push({

        name:
          holiday.name,

        date:
          eventDate,

        className:
          holiday.className,

        emoji:
          holiday.emoji

      });

    }
  );



  let thanksgivingDate =
    thanksgiving(
      today.getFullYear()
    );


  if (
    thanksgivingDate < today
  ) {

    thanksgivingDate =
      thanksgiving(
        today.getFullYear() + 1
      );

  }


  events.push({

    name:
      "Thanksgiving",

    date:
      thanksgivingDate,

    className:
      "thanksgiving",

    emoji:
      "🦃"

  });



  const newYear =
    new Date(
      today.getFullYear() + 1,
      0,
      1
    );


  events.push({

    name:
      "New Year's",

    date:
      newYear,

    className:
      "newyear",

    emoji:
      "🎆"

  });



  events.sort(
    (a, b) =>
      a.date - b.date
  );


  return events.slice(
    0,
    5
  );

}



/* =========================
   RENDER COUNTDOWNS
========================= */

function renderCountdowns() {

  const now =
    new Date();


  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );


  const cards =
    document.getElementById(
      "cards"
    );


  cards.innerHTML =
    "";


  upcomingEvents()
    .forEach(
      event => {


        const days =
          Math.round(

            (
              event.date -
              today
            )

            /

            86400000

          );


        const dateText =
          event.date
            .toLocaleDateString(

              "en-US",

              {

                month:
                  "long",

                day:
                  "numeric"

              }

            );



        const card =
          document.createElement(
            "div"
          );


        card.className =
          "card " +
          event.className;



        card.innerHTML = `

          <div class="emoji">
            ${event.emoji}
          </div>

          <div class="event-name">
            ${event.name}
          </div>

          <div class="days">
            ${days}
          </div>

          <div class="days-label">
            DAYS
          </div>

          <div class="event-date">
            ${dateText}
          </div>

        `;


        cards.appendChild(
          card
        );

      }
    );

}


renderCountdowns();


</script>


</body>

</html>
